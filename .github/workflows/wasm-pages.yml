name: 🌐 Build WASM & Deploy Demo

# Builds the WebAssembly module (issue #171) and publishes the browser demo to
# GitHub Pages. The .wasm is built here rather than committed: it is a megabyte
# of generated output, and a stale binary next to live sources is worse than a
# two minute build.

# Manual only for now: GitHub Pages is not enabled on this repository, and
# which branch should publish the demo is still to be decided.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs supersede rather than race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # No LFS: the WASM build reads no test data, and emcmake turns the
        # integrity check off by default.

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-6.0.6

      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          # Pinned to the version the demo was developed and tested against.
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.6
          ~/emsdk/emsdk activate 6.0.6

      - name: Build the WebAssembly module
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j"$(nproc)"

      - name: Report size
        run: |
          {
            echo "### WebAssembly build"
            echo "| file | raw | gzip | brotli |"
            echo "| --- | --- | --- | --- |"
            for f in bin/forefire.wasm bin/forefire.mjs; do
              printf '| `%s` | %s | %s | %s |\n' "$(basename "$f")" \
                "$(stat -c%s "$f" | numfmt --to=iec)" \
                "$(gzip -c "$f" | wc -c | numfmt --to=iec)" \
                "$(brotli -c "$f" | wc -c | numfmt --to=iec)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test under Node
        run: node bindings/wasm/smoke.mjs bin/forefire.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp bin/forefire.mjs bin/forefire.wasm _site/
          cp bindings/wasm/index.html bindings/wasm/worker.mjs \
             bindings/wasm/landscape.mjs bindings/wasm/terrain3d.mjs _site/
          # Pages serves through Jekyll unless told otherwise, which would
          # swallow files it does not recognise.
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
